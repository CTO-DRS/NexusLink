<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NexusLink</title>
<style>
  :root {
    --bg: #0b1220;
    --cyan: #22d3ee;
    --text: #e2e8f0;
    --muted: #64748b;
    --ok: #34d399;
    --err: #f87171;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(1200px 700px at 50% -10%, #14233f 0%, var(--bg) 55%);
    color: var(--text);
    font-family: "Segoe UI", "Noto Sans Arabic", system-ui, -apple-system, sans-serif;
    display: grid; place-items: center;
    overflow: hidden;
  }
  .card { text-align: center; padding: 28px 34px; width: 100%; }
  .ring {
    width: 96px; height: 96px; margin: 0 auto 22px;
    border-radius: 50%;
    position: relative;
    background:
      conic-gradient(from -90deg, var(--cyan) 0 270deg, rgba(255,255,255,.10) 270deg 360deg);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 8px), #000 calc(100% - 7px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 8px), #000 calc(100% - 7px));
    animation: spin 1.1s linear infinite;
  }
  .ring::after {
    content: "";
    position: absolute; inset: -10px;
    border-radius: 50%;
    border: 1px solid rgba(34, 211, 238, .18);
    animation: pulse 2s ease-out infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 0% { transform: scale(.92); opacity: .9 } 100% { transform: scale(1.12); opacity: 0 } }
  h1 { font-size: 21px; font-weight: 700; letter-spacing: .4px; margin-bottom: 4px; }
  h1 span { color: var(--cyan); }
  .sub { font-size: 11px; color: var(--muted); letter-spacing: 2.2px; text-transform: uppercase; margin-bottom: 20px; }
  .stage {
    min-height: 44px;
    font-size: 13.5px; line-height: 1.55;
    color: var(--text);
  }
  .stage .en { font-size: 11px; color: var(--muted); direction: ltr; margin-top: 3px; }
  .stage.err  { color: var(--err); }
  .stage.ok   { color: var(--ok); }
  .bar {
    height: 4px; width: 240px; margin: 16px auto 0;
    background: rgba(255,255,255,.07); border-radius: 99px; overflow: hidden;
  }
  .bar i {
    display: block; height: 100%; width: 36%;
    background: linear-gradient(90deg, transparent, var(--cyan), transparent);
    border-radius: 99px;
    animation: slide 1.2s ease-in-out infinite;
  }
  @keyframes slide { 0% { transform: translateX(120%) } 100% { transform: translateX(-420%) } }
  .foot { position: fixed; bottom: 12px; inset-inline: 0; font-size: 10px; color: #334155; letter-spacing: 1px; }
</style>
</head>
<body>
  <div class="card">
    <div class="ring" id="ring"></div>
    <h1>Nexus<span>Link</span></h1>
    <div class="sub">DECIDE · CONNECT · CONTROL</div>
    <div class="stage" id="stage">
      يجري تشغيل سيرفر NexusLink داخل التطبيق…
      <div class="en">Starting the embedded NexusLink server…</div>
    </div>
    <div class="bar"><i></i></div>
  </div>
  <div class="foot">v1.0.0 — Nexus/1.2</div>
<script>
  const el = document.getElementById("stage");
  const ring = document.getElementById("ring");
  function setStatus(p) {
    if (!p) return;
    el.classList.remove("err", "ok");
    if (p.stage === "ready") {
      el.classList.add("ok");
      ring.style.animationDuration = "0.35s";
    }
    if (p.stage === "error" || p.stage === "paused") el.classList.add("err");
    el.innerHTML =
      (p.ar ? String(p.ar) : "") +
      (p.en ? '<div class="en">' + String(p.en) + "</div>" : "");
  }
  try {
    const t = window.__TAURI__;
    if (t?.event?.listen) {
      t.event.listen("desktop://status", (e) => setStatus(e.payload));
    }
  } catch (_) { /* خارج Tauri: رسالة ثابتة */ }
</script>
</body>
</html>
