<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NexusLink — مقفول</title>
<style>
  :root {
    --bg: #0b1220;
    --cyan: #22d3ee;
    --text: #e2e8f0;
    --muted: #64748b;
    --ok: #34d399;
    --err: #f87171;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(1200px 700px at 50% -10%, #14233f 0%, var(--bg) 55%);
    color: var(--text);
    font-family: "Segoe UI", "Noto Sans Arabic", system-ui, -apple-system, sans-serif;
    display: grid; place-items: center;
    overflow: hidden;
  }
  .card { text-align: center; width: 100%; max-width: 340px; padding: 24px; }
  .lockicon {
    width: 74px; height: 74px; margin: 0 auto 14px;
    border-radius: 50%;
    background: rgba(34, 211, 238, .10);
    border: 1px solid rgba(34, 211, 238, .25);
    display: grid; place-items: center;
    font-size: 34px;
  }
  h1 { font-size: 19px; font-weight: 700; letter-spacing: .4px; margin-bottom: 4px; }
  h1 span { color: var(--cyan); }
  .sub { font-size: 11.5px; color: var(--muted); margin-bottom: 18px; line-height: 1.6; }
  .dots { display: flex; gap: 10px; justify-content: center; margin-bottom: 8px; height: 18px; }
  .dot {
    width: 14px; height: 14px; border-radius: 50%;
    border: 1.5px solid rgba(226, 232, 240, .35);
    transition: all .12s ease;
  }
  .dot.on { background: var(--cyan); border-color: var(--cyan); box-shadow: 0 0 10px rgba(34,211,238,.5); }
  .msg { min-height: 20px; font-size: 12px; color: var(--err); margin-bottom: 10px; }
  .msg.ok { color: var(--ok); }
  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
  .key {
    height: 52px; border-radius: 14px;
    border: 1px solid rgba(255,255,255,.09);
    background: rgba(255,255,255,.045);
    color: var(--text); font-size: 20px; font-weight: 600;
    cursor: pointer; transition: background .1s, transform .05s;
    font-family: inherit;
  }
  .key:hover { background: rgba(255,255,255,.09); }
  .key:active { transform: scale(.96); }
  .key.fn { font-size: 15px; color: var(--muted); }
  .bio {
    width: 100%; height: 44px; border-radius: 14px;
    border: 1px solid rgba(52, 211, 153, .35);
    background: rgba(52, 211, 153, .08);
    color: var(--ok); font-size: 13.5px; font-weight: 600;
    cursor: pointer; font-family: inherit;
    display: none; align-items: center; justify-content: center; gap: 8px;
  }
  .bio.show { display: flex; }
  .bio:disabled { opacity: .5; cursor: wait; }
  .shake { animation: shake .3s ease; }
  @keyframes shake {
    0%,100% { transform: translateX(0) }
    25% { transform: translateX(-7px) } 75% { transform: translateX(7px) }
  }
  .hint { margin-top: 14px; font-size: 10.5px; color: var(--muted); line-height: 1.7; }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="lockicon">🔒</div>
    <h1>Nexus<span>Link</span> — مقفول</h1>
    <div class="sub" id="sub">أدخل رمز القفل للمتابعة</div>
    <div class="dots" id="dots"></div>
    <div class="msg" id="msg"></div>
    <div class="pad" id="pad"></div>
    <button class="bio" id="bio">👁‍🗨 فتح بالبصمة (Windows Hello / Touch ID)</button>
    <div class="hint">أعِد إدخال الرمز أو استخدم البصمة المسجّلة على هذا الجهاز</div>
  </div>
<script>
(function () {
  var MAX = 32;
  var pin = "";
  var dotsEl = document.getElementById("dots");
  var msgEl = document.getElementById("msg");
  var cardEl = document.getElementById("card");
  var bioBtn = document.getElementById("bio");
  var busy = false;

  function invoke(cmd, args) {
    var inv = window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.invoke;
    if (!inv) return Promise.reject(new Error("no tauri"));
    return inv(cmd, args);
  }

  function render() {
    while (dotsEl.children.length < Math.max(4, pin.length)) {
      var d = document.createElement("div");
      d.className = "dot";
      dotsEl.appendChild(d);
    }
    for (var i = 0; i < dotsEl.children.length; i++) {
      dotsEl.children[i].className = "dot" + (i < pin.length ? " on" : "");
    }
  }

  function setMsg(text, ok) {
    msgEl.textContent = text || "";
    msgEl.className = "msg" + (ok ? " ok" : "");
  }

  function submit() {
    if (busy || pin.length < 4) return;
    busy = true;
    setMsg("");
    invoke("lock_verify_pin", { pin: pin }).then(function (r) {
      if (r && r.ok) {
        setMsg("تم الفتح ✓", true);
        // النافذة تُغلق من الطبقة الأصلية بعد النجاح
        setTimeout(function () { window.close(); }, 250);
      } else {
        pin = "";
        render();
        setMsg((r && r.error) || "رمز خاطئ");
        cardEl.classList.remove("shake");
        void cardEl.offsetWidth;
        cardEl.classList.add("shake");
        busy = false;
      }
    }).catch(function (e) {
      setMsg("تعذر التحقق: " + (e && e.message ? e.message : e));
      busy = false;
    });
  }

  function press(k) {
    if (busy) return;
    if (k === "del") {
      pin = pin.slice(0, -1);
    } else if (k === "clr") {
      pin = "";
    } else if (pin.length < MAX) {
      pin += k;
    }
    render();
    if (pin.length >= 4 && k !== "del" && k !== "clr") submit();
  }

  // لوحة الأرقام — ترتيب هاتفي
  var layout = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "clr", "0", "del"];
  var labels = { clr: "مسح", del: "⌫" };
  var padEl = document.getElementById("pad");
  layout.forEach(function (k) {
    var b = document.createElement("button");
    b.className = "key" + (labels[k] ? " fn" : "");
    b.textContent = labels[k] || k;
    b.addEventListener("click", function () { press(k); });
    padEl.appendChild(b);
  });

  // لوحة المفاتيح الفعلية
  document.addEventListener("keydown", function (e) {
    if (e.key >= "0" && e.key <= "9") press(e.key);
    else if (e.key === "Backspace") press("del");
    else if (e.key === "Escape") press("clr");
  });

  // البصمة — تظهر فقط عند توفرها فعلًا
  invoke("lock_state").then(function (s) {
    if (s && s.biometric && s.hasPin !== undefined) {
      bioBtn.classList.add("show");
    }
    if (s && !s.hasPin && s.biometric) {
      document.getElementById("sub").textContent = "لا رمز مضبوطًا — افتح بالبصمة";
    }
  }).catch(function () {});

  bioBtn.addEventListener("click", function () {
    if (busy) return;
    busy = true;
    bioBtn.disabled = true;
    setMsg("انتظر التحقق الحيوي…", true);
    invoke("lock_biometric").then(function (r) {
      if (r && r.ok) {
        setMsg("تم الفتح ✓", true);
        setTimeout(function () { window.close(); }, 250);
      } else {
        setMsg((r && r.error) || "لم تُقبل البصمة");
        busy = false;
        bioBtn.disabled = false;
      }
    }).catch(function (e) {
      setMsg("البصمة غير متاحة — استخدم الرمز");
      busy = false;
      bioBtn.disabled = false;
    });
  });

  render();
})();
</script>
</body>
</html>
