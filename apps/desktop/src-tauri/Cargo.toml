[package]
name = "nexuslink-desktop"
version = "3.0.0"
description = "NexusLink — جسر الأجهزة (سيرفر مضمّن + واجهة + Tray + طبقة أصلية)"
authors = ["DRS"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-notification = "2"
# FA-files — سحب الملفات من التطبيق إلى سطح المكتب/المجلدات (drag-out)
tauri-plugin-drag = "2.1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3"
ureq = { version = "2", features = ["json"] }
# FA-clipboard-sync — ترميز/فك PNG لصور الحافظة (نفس نسخة image في شجرة arboard)
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
# FA-input (عقد §13) — تنفيذ أحداث اللمس/الكيبورد/الوسائط من الهاتف على النظام.
# x11rb = خلفية X11 خالصة Rust (بلا libxdo C)؛ إعادة ربط keycodes تدعم العربية.
enigo = { version = "0.2.1", default-features = false, features = ["x11rb"] }

# FA-files (عقد §14) — دمج الملفات في نظام التشغيل:
# notify: مراقب ملفات أصلي فوري (inotify/FSEvents/ReadDirectoryChangesW) للمزامنة
notify = "8"
# zip: ضغط المجلدات من قائمة الزر الأيمن قبل الإرسال
zip = { version = "2", default-features = false, features = ["deflate"] }

# ---------------------------------------------------------------------------
# FA-media (عقد §15) — طبقة الوسائط الأصلية:
#  · webrtc 0.21 (webrtc-rs Sans-I/O): بث شاشة الكمبيوتر إلى الهاتف (kind=screen)
#    واستقبال كاميرا/ميكروفون الهاتف (kind=cam/mic) — الإشارات عبر جسر 3005
#    والوسائط RTP مباشرة عبر الشبكة المحلية (مرشحات host مضمّنة في SDP).
#  · openh264 (مضمن C++): ترميز إطارات الشاشة H264 وفك بث الكاميرا H264
#    (packetization-mode=1 — يطابق fmtp المعلن في العقد).
#  · audiopus (libopus مضمن عبر cmake): فك صوت الهاتف Opus → PCM للأجهزة الافتراضية.
#  · الالتقاط: scap على ويندوز/ماك (Windows.Graphics.Capture/ScreenCaptureKit) —
#    وعلى لينكس X11 مباشرة عبر x11rb (scap هناك يعتمد PipeWire/portal — موثق بصدق).
# ---------------------------------------------------------------------------
# rtc 0.21 = نواة webrtc المنشورة منفصلة — أنواعها (Sample/TrackLocalStaticSample/
# MediaStreamTrack/H264Packet/...) تُستورد مباشرة منها كما في أمثلة webrtc-rs الرسمية
rtc = "0.21.1"
webrtc = "0.21"
openh264 = { version = "0.9", features = ["source"] }
audiopus = "=0.3.0-rc.0"
# سمات معالج الأحداث (async_trait) + عازل بايتات العينات (Sample.data)
async-trait = "0.1"
bytes = "1"

# ---------------------------------------------------------------------------
# FA-harden (عقد §16) — تقوية الإصدار:
#  · hmac+sha2: PBKDF2-HMAC-SHA256 لرمز القفل (تنفيذ يدوي — متجهات RFC في
#    scripts/hardening-verify). الهاش والملح محليان في config.json حصرًا.
#  · tauri-plugin-updater: المحدّث الموقّع (minisign/Ed25519) — نقطة الفحص
#    latest.json على GitHub Releases + pubkey في tauri.conf.json + مفاتيح
#    التوقيع أسرار CI (TAURI_SIGNING_PRIVATE_KEY*).
# ---------------------------------------------------------------------------
hmac = "0.12"
sha2 = "0.10"
tauri-plugin-updater = "2"

# الالتقاط على لينكس — x11rb (نفس خلفية enigo): GetImage + RandR للشاشات + نوافذ
# + screensaver (FA-harden — كشف الخمول XScreenSaver)
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["randr", "screensaver"] }
# الجولة 4 مرحلة ② (عقد §20) — اللوحة الافتراضية: ioctls و/dev/uinput
# (أساس النواة الرسمي — بلا سائق خارجي). libc موجودة أصلاً في شجرة الحل
# (enigo/x11rb/notify) — تفعيل استخدام مباشر موثق.
libc = "0.2"

# الالتقاط: ماك فقط عبر scap (ScreenCaptureKit — Options/Target/FrameType من
# مصدر v0.0.8 المنشورة حرفيًا). لينكس لا يلمسها إطلاقًا.
# ويندوز: scap 0.0.8 مكسور حرفيًا مع أي windows-capture منشورة (يورد
# windows_capture::capture::Context المحذوفة — E0432 في CI جولة 3 لـ FA-media)
# → الالتقاط على ويندوز عبر windows-capture 1.3.6 مباشرة (GraphicsCaptureApiHandler
#   + on_frame_arrived + start_free_threaded — تواقيع متحققة من مصدرها).
[target.'cfg(target_os = "macos")'.dependencies]
cpal = "0.18"
scap = "0.0.8"
# FA-harden — قفل التطبيق على ماك: Touch ID عبر LocalAuthentication
# (objc2-local-authentication 0.3 — تواقيع متحققة من مصدره: LAContext::new()
#  unsafe + canEvaluatePolicy_error -> Result<(), Retained<NSError>> +
#  evaluatePolicy_localizedReason_reply(policy, &NSString, &DynBlock<dyn Fn(Bool, *mut NSError)>)
#  — ميزة LAPolicy غير موجودة في الكرِيت: الـ enum يأتي مع LAContext
#  (mod.rs: cfg(feature="LAContext") pub use __LAContext::LAPolicy) — جولة CI
#  R3-s1 أثبتت الفشل بـ "does not have that feature")
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSError"] }
objc2-local-authentication = { version = "0.3", features = ["block2", "LAContext"] }
block2 = "0.6"

# إخراج صوت الهاتف إلى درايفر الصوت الافتراضي (VB-CABLE على ويندوز / BlackHole على ماك)
# — على لينكس لا حاجة: module-pipe-source عبر pactl (FIFO خام) بلا أي crate.
# إشعارات ويندوز الأصلية بأزرار تفاعلية (WinRT Toast)
# FA-files — قائمة الزر الأيمن Windows (HKCU — بلا صلاحيات مدير)
# FA-media — الالتقاط على ويندوز مباشرة (بديل scap المكسور)
# FA-harden — قفل التطبيق: Windows Hello (UserConsentVerifier) + BCryptGenRandom
#   (ملح PIN — وحدة Win32::Security::Cryptography لا Authentication::Identity —
#   متحقق من مصدر windows-rs 0.58: BCryptGenRandom(halgorithm: Param<BCRYPT_ALG_HANDLE>
#   ⇒ None صالح، pbbuffer: &mut [u8]، dwflags: BCRYPTGENRANDOM_FLAGS)
#   + GetLastInputInfo (كشف الخمول) — نفس نسخة windows 0.58 التي
#   تعتمدها windows-capture (ترجمة مشتركة لا مضاعفة)
[target.'cfg(windows)'.dependencies]
cpal = "0.18"
tauri-winrt-notification = "0.8"
winreg = "0.56"
windows-capture = "1.3.6"
windows = { version = "0.58", features = [
  "Security_Credentials_UI",
  "Win32_Security_Cryptography",
  "Win32_System_Com",
  "Win32_System_SystemInformation",
  "Win32_UI_Input_KeyboardAndMouse",
] }

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
codegen-units = 1
