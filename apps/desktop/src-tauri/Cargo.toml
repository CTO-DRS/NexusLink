[package]
name = "nexuslink-desktop"
version = "1.0.0"
description = "NexusLink — جسر الأجهزة (سيرفر مضمّن + واجهة + Tray + طبقة أصلية)"
authors = ["DRS"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-notification = "2"
# FA-files — سحب الملفات من التطبيق إلى سطح المكتب/المجلدات (drag-out)
tauri-plugin-drag = "2.1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3"
ureq = { version = "2", features = ["json"] }
# FA-clipboard-sync — ترميز/فك PNG لصور الحافظة (نفس نسخة image في شجرة arboard)
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
# FA-input (عقد §13) — تنفيذ أحداث اللمس/الكيبورد/الوسائط من الهاتف على النظام.
# x11rb = خلفية X11 خالصة Rust (بلا libxdo C)؛ إعادة ربط keycodes تدعم العربية.
enigo = { version = "0.2.1", default-features = false, features = ["x11rb"] }

# FA-files (عقد §14) — دمج الملفات في نظام التشغيل:
# notify: مراقب ملفات أصلي فوري (inotify/FSEvents/ReadDirectoryChangesW) للمزامنة
notify = "8"
# zip: ضغط المجلدات من قائمة الزر الأيمن قبل الإرسال
zip = { version = "2", default-features = false, features = ["deflate"] }

# ---------------------------------------------------------------------------
# FA-media (عقد §15) — طبقة الوسائط الأصلية:
#  · webrtc 0.21 (webrtc-rs Sans-I/O): بث شاشة الكمبيوتر إلى الهاتف (kind=screen)
#    واستقبال كاميرا/ميكروفون الهاتف (kind=cam/mic) — الإشارات عبر جسر 3005
#    والوسائط RTP مباشرة عبر الشبكة المحلية (مرشحات host مضمّنة في SDP).
#  · openh264 (مضمن C++): ترميز إطارات الشاشة H264 وفك بث الكاميرا H264
#    (packetization-mode=1 — يطابق fmtp المعلن في العقد).
#  · audiopus (libopus مضمن عبر cmake): فك صوت الهاتف Opus → PCM للأجهزة الافتراضية.
#  · الالتقاط: scap على ويندوز/ماك (Windows.Graphics.Capture/ScreenCaptureKit) —
#    وعلى لينكس X11 مباشرة عبر x11rb (scap هناك يعتمد PipeWire/portal — موثق بصدق).
# ---------------------------------------------------------------------------
# rtc 0.21 = نواة webrtc المنشورة منفصلة — أنواعها (Sample/TrackLocalStaticSample/
# MediaStreamTrack/H264Packet/...) تُستورد مباشرة منها كما في أمثلة webrtc-rs الرسمية
rtc = "0.21.1"
webrtc = "0.21"
openh264 = { version = "0.9", features = ["source"] }
audiopus = "=0.3.0-rc.0"
# سمات معالج الأحداث (async_trait) + عازل بايتات العينات (Sample.data)
async-trait = "0.1"
bytes = "1"

# الالتقاط على لينكس — x11rb (نفس خلفية enigo): GetImage + RandR للشاشات + نوافذ
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["randr"] }

# الالتقاط: ماك فقط عبر scap (ScreenCaptureKit — Options/Target/FrameType من
# مصدر v0.0.8 المنشورة حرفيًا). لينكس لا يلمسها إطلاقًا.
# ويندوز: scap 0.0.8 مكسور حرفيًا مع أي windows-capture منشورة (يورد
# windows_capture::capture::Context المحذوفة — E0432 في CI جولة 3 لـ FA-media)
# → الالتقاط على ويندوز عبر windows-capture 1.3.6 مباشرة (GraphicsCaptureApiHandler
#   + on_frame_arrived + start_free_threaded — تواقيع متحققة من مصدرها).
[target.'cfg(target_os = "macos")'.dependencies]
cpal = "0.18"
scap = "0.0.8"

# إخراج صوت الهاتف إلى درايفر الصوت الافتراضي (VB-CABLE على ويندوز / BlackHole على ماك)
# — على لينكس لا حاجة: module-pipe-source عبر pactl (FIFO خام) بلا أي crate.
# إشعارات ويندوز الأصلية بأزرار تفاعلية (WinRT Toast)
# FA-files — قائمة الزر الأيمن Windows (HKCU — بلا صلاحيات مدير)
# FA-media — الالتقاط على ويندوز مباشرة (بديل scap المكسور)
[target.'cfg(windows)'.dependencies]
cpal = "0.18"
tauri-winrt-notification = "0.8"
winreg = "0.56"
windows-capture = "1.3.6"

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
codegen-units = 1
