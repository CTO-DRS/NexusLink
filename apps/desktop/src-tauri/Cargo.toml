[package]
name = "nexuslink-desktop"
version = "1.0.0"
description = "NexusLink — جسر الأجهزة (سيرفر مضمّن + واجهة + Tray)"
authors = ["DRS"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
codegen-units = 1
