plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

// ---------- FA-10: توقيع الإصدار (key.properties + keystore محلي/CI) ----------
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "1"
def flutterVersionName = localProperties.getProperty("flutter.versionName") ?: "1.1.0"

android {
    namespace = "com.nexuslink.mobile"
    compileSdk = 34

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = "11"
    }

    defaultConfig {
        applicationId = "com.nexuslink.mobile"
        minSdk = 24
        targetSdk = 34
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
                storeFile file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            // FA-10: توقيع الإصدار الحقيقي عند وجود key.properties — وإلا توقيع التطوير للجري السريع
            signingConfig = keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
            minifyEnabled = false
            shrinkResources = false
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // عميل socket.io الرسمي (Java) — يعمل داخل الـ Foreground Service
    implementation "io.socket:socket.io-client:2.1.0"
    // OkHttp يأتي مع socket.io-client (WebSocket transport)
    // مراقبة الصور الدورية عبر WorkManager (البند 6)
    implementation "androidx.work:work-runtime-ktx:2.9.1"
    // FileProvider + أدوات core (لفتح الملفات المستلمة)
    implementation "androidx.core:core-ktx:1.13.1"
    // FA-10: libsodium عبر lazysodium — X25519 + AES-256-GCM للقناة المشفرة 3009
    implementation "com.goterl:lazysodium-android:5.1.0@aar"
    implementation "net.java.dev.jna:jna:5.2.0@aar"
}
