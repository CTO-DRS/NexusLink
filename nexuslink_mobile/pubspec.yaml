name: nexuslink_mobile
description: "NexusLink Device Agent — وكيل الجهاز لمنصة ربط الأجهزة NexusLink (LAN فقط)"
publish_to: "none"
version: 3.1.1+7

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ---- الحالة (المعتمد: Riverpod) ----
  flutter_riverpod: ^2.6.1

  # ---- الاتصال بالسيرفر ----
  socket_io_client: ^2.0.3+1   # قنوات socket.io التفاعلية (نفس بروتوكول السيرفر v4)
  http: ^1.2.2                  # REST (/api/*)
  crypto: ^3.0.3                # P1 — SHA-256 لقطع الرفع v2 (§8.6) ومعرّف الجلسة
  bonsoir: ^5.1.0               # اكتشاف mDNS: _nexuslink._tcp
  # G3: مسح QR الاقتران أصلي عبر ZXing (android/app/build.gradle) — mobile_scanner
  # أُزيل لأنه يجرّ Google ML Kit + Firebase إلى APK (ادعاء «صفر سحابة»).

  # ---- التخزين المحلي (المعتمد: drift/SQLite) ----
  drift: ^2.20.3
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  shared_preferences: ^2.3.2

  # ---- التعريب والمظهر ----
  easy_localization: ^3.0.7
  intl: any

  # ---- الأذونات (طلب وقت الاستخدام) ----
  permission_handler: ^11.3.1

  # ---- FA-10: قفل التطبيق — بصمة/وجه عبر BiometricPrompt ----
  local_auth: ^2.2.0

  # ---- نقل الملفات: منتقي الملفات/المجلدات ----
  file_picker: ^8.1.2
  flutter_webrtc: ^1.6.2+hotfix.4
  sensors_plus: ^6.1.1
  image: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.20.3
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - assets/translations/
  # P0/G3: IBM Plex Sans Arabic مضمَّن (OFL — assets/fonts/ibm-plex-sans-arabic/OFL.txt) بدل google_fonts
  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/ibm-plex-sans-arabic/IBMPlexSansArabic-Regular.ttf
        - asset: assets/fonts/ibm-plex-sans-arabic/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/ibm-plex-sans-arabic/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ibm-plex-sans-arabic/IBMPlexSansArabic-Bold.ttf
          weight: 700
