name: nexuslink_mobile
description: "NexusLink Device Agent — وكيل الجهاز لمنصة ربط الأجهزة NexusLink (LAN فقط)"
publish_to: "none"
version: 3.1.0+6

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ---- الحالة (المعتمد: Riverpod) ----
  flutter_riverpod: ^2.6.1

  # ---- الاتصال بالسيرفر ----
  socket_io_client: ^2.0.3+1   # قنوات socket.io التفاعلية (نفس بروتوكول السيرفر v4)
  http: ^1.2.2                  # REST (/api/*)
  bonsoir: ^5.1.0               # اكتشاف mDNS: _nexuslink._tcp
  mobile_scanner: ^5.2.3        # مسح QR الاقتران

  # ---- التخزين المحلي (المعتمد: drift/SQLite) ----
  drift: ^2.20.3
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  shared_preferences: ^2.3.2

  # ---- التعريب والمظهر ----
  easy_localization: ^3.0.7
  google_fonts: ^6.2.1          # IBM Plex Sans Arabic — نفس خط نسخة الويب
  intl: any

  # ---- الأذونات (طلب وقت الاستخدام) ----
  permission_handler: ^11.3.1

  # ---- FA-10: قفل التطبيق — بصمة/وجه عبر BiometricPrompt ----
  local_auth: ^2.2.0

  # ---- نقل الملفات: منتقي الملفات/المجلدات ----
  file_picker: ^8.1.2
  flutter_webrtc: ^1.6.2+hotfix.4
  sensors_plus: ^6.1.1
  image: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.20.3
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - assets/translations/
