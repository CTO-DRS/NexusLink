# Dependabot — تحديثات اعتماديات آلية أسبوعية
#
# العقيدة: الثغرة المعروفة في اعتمادية قديمة أسهل ثغرة تُغلق — الفحص الأسبوعي
# يرفع طلبات دمج جاهزة تمرّ ببوابة الجودة (quality.yml: lint + tsc + build)
# وحرس الأسرار قبل أي دمج، فالتبني قرار واعٍ موثق لا انجراف صامت.
#
# النطاق: حزمة bun الجذرية (bun.lock) + حزم GitHub Actions الثلاث المستخدمة.

version: 2

updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    commit-message:
      prefix: "deps"
    ignore:
      # E2E crypto core (X25519/HKDF): a major bump renames the API and changes the
      # bundled hashes peer. It is a deliberate migration with device QA, not a drive-by bump.
      - dependency-name: "@noble/curves"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@noble/hashes"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "ci"
