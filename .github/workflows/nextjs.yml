# نشر صفحة النشر الساكنة على GitHub Pages — بلا Node إطلاقًا.
#
# لماذا لا يُبنى تطبيق Next.js هنا؟
#   1. التطبيق ديناميكي حقيقي (مقبس Socket.IO + Prisma + API routes) — لا يقبل
#      التصدير الساكن (output: export) أصلًا، فقالب «next build → ./out» مستحيل هنا.
#   2. القالب القديم (نموذج Next.js الرسمي) كان يفشل في Setup Node لغياب
#      package-lock.json/yarn.lock — المستودع bun (bun.lock) — فكان أحمر في كل دفعة.
# ما يُنشر: public/NexusLink-Release-Page.html كما هو باسم index.html —
# نفس الصفحة التي يخدمها التطبيق نفسه على /NexusLink-Release-Page.html.
# وأصول SEO في public/seo/ تُنسخ إلى جذر الموقع:
# robots.txt · sitemap.xml · llms.txt · ملف تحقق Google Search Console · مفتاح IndexNow.

name: Deploy release page to Pages

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/nextjs.yml"
      - "public/NexusLink-Release-Page.html"
      - "public/seo/**"
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job — تجميع الموقع الساكن (ملف واحد)
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp public/NexusLink-Release-Page.html _site/index.html
          cp -r public/seo/. _site/
          echo "site: index.html $(wc -c < _site/index.html) bytes"
          echo "seo files:"; ls -A _site/
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
