name: Release — NexusLink (5 platforms)

# الجولة 3 — الإصدار النهائي:
#   Windows : NSIS + MSI + Portable ZIP (بلا تثبيت)
#   macOS   : DMG (+ أصل updater .app.tar.gz موقّع)
#   Linux   : AppImage + deb
#   Android : APK موقّع مقسّم لكل معمارية (arm64-v8a/armeabi-v7a/x86_64) + AAB
#   iOS     : IPA (بلا توقيع — يتطلب حساب Apple)
# الإرفاق بالـ Release تلقائي على وسوم v*؛ وعند workflow_dispatch البناء
# يُنتج artifacts فقط ما لم تُفعَّل مدخل attach_to_release صراحةً
# (حماية: لا تُستبدل أصول إصدار منشور موقّع بالخطأ — نمط v1.0.0/v1.1.0).
#
# G9 — أمان الإصدار: كل خطوة تُنشئ/ترفع إلى Release تعمل على مسودة (draft) حصرًا.
#   · وظيفة prepare-release تُنشئ مسودة الوسم مرة واحدة قبل أي رفع (لا سباق
#     إنشاء بين وظائف المنصات — المسودات لا تحجز الوسم فقد تتكرر).
#   · softprops بـ draft: true لا يُنهي (finalize) الإصدار أبدًا ⇒ فشل منصة واحدة
#     لا يترك إصدارًا عامًا ناقصًا.
#   · النشر خطوة يدوية للمالك بعد مراجعة المسودة (Releases → Edit → Publish).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      attach_to_release:
        description: "أرفق الأصول بالـ Release المحدد (افتراضيًا artifacts فقط)"
        type: boolean
        default: false
      release_tag:
        description: "وسم الإصدار عند الإرفاق اليدوي"
        type: string
        default: "v0.1.0"

permissions:
  contents: write

env:
  VERSION: "0.1.0" # رقم إصدار موحّد لكل المنصات (يجب أن يطابق الملفات الأربعة — BUILD.md §5)

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - name: Unit tests (core engines)
        shell: bash
        run: bun test || echo "no tests yet"

  # G9 — مسودة الإصدار تُنشأ مرة واحدة قبل وظائف المنصات (وسوم v* حصرًا).
  # إصدار منشور مسبقًا بنفس الوسم = فشل صريح (لا نلمس إصدارًا عامًا).
  prepare-release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Ensure draft release exists for tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # /releases/tags/<tag> لا يُعيد المسودات — القائمة الكاملة تشملها (صلاحية كتابة)
          FOUND=$(gh api "repos/$REPO/releases?per_page=100" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\") | \"\(.id) \(.draft)\"")
          FOUND="${FOUND%%$'\n'*}"   # الأول فقط (بلا head — SIGPIPE مع pipefail)
          if [ -z "$FOUND" ]; then
            gh api -X POST "repos/$REPO/releases" \
              -f tag_name="$TAG" -f name="NexusLink $TAG" \
              -f body="مسودة — تُستكمل الأصول آليًا ثم ينشرها المالك يدويًا." \
              -F draft=true -F prerelease=false --jq '"created draft release id=\(.id)"'
          else
            read -r RID RDRAFT <<< "$FOUND"
            if [ "$RDRAFT" != "true" ]; then
              echo "::error::الإصدار $TAG منشور مسبقًا (id=$RID) — لا رفع إلى إصدار عام. احذفه أو استخدم وسمًا جديدًا."
              exit 1
            fi
            echo "reusing existing draft release id=$RID for $TAG"
          fi

  desktop:
    needs: [test, prepare-release]
    # prepare-release يُتخطّى على workflow_dispatch — تخطيه لا يحجب البناء
    if: ${{ !cancelled() && needs.test.result == 'success' && (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            os-name: linux
            # deb أولًا: الأكثر حساسية ثم AppImage (NO_STRIP مطلوب — linuxdeploy
            # يفشل على strip لمكتبات تحوي .relr.dyn — موثق في tauri#14796)
            bundles: "deb appimage"
            # -v: البندر يبتلع مخرجات linuxdeploy عند مستوى الخطأ فقط —
            # output_ok يطبع عند debug (تشخيص فشل r3/r4 الصامت)
            tauri-args: "-v"
            node-dist: "linux-x64"
            node-triple: "x86_64-unknown-linux-gnu"
          - os: windows-latest
            os-name: windows
            bundles: "nsis msi"
            # -v: light.exe يبتلع مخرجاته أيضًا (فشل r3/r4 بعد 56-58ث بلا سبب مرئي)
            tauri-args: "-v"
            node-dist: "win-x64"
            node-triple: "x86_64-pc-windows-msvc"
          - os: macos-latest
            os-name: macos
            # app مع dmg: أصل updater (.app.tar.gz + .sig) يُنتج فقط عند bundling التطبيق
            bundles: "dmg app"
            tauri-args: ""
            node-dist: "darwin-arm64"
            node-triple: "aarch64-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      # الخدمات المصغّرة حزم مستقلة (tsconfig الجذري يشملها بـ**/*.ts — next build يفحص أنواعها)
      - name: Install comms-service deps
        shell: bash
        run: cd mini-services/comms-service && bun install --frozen-lockfile

      # bash على المنصات الثلاث (الدرس: لا تعتمد على shell الافتراضي لكل نظام)
      - name: Generate Prisma client
        shell: bash
        run: bunx prisma generate

      - name: Build Next standalone
        shell: bash
        run: |
          bunx next build
          cp -r .next/static .next/standalone/.next/
          cp -r public .next/standalone/

      - name: Assemble desktop resources (server + comms + gateway)
        shell: bash
        run: bash apps/desktop/build-resources.sh

      - name: Download Node sidecar (v20.18.1)
        shell: bash
        run: |
          NODE_VERSION=v20.18.1
          mkdir -p apps/desktop/src-tauri/binaries
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            curl -fL -o node-pkg.zip "https://nodejs.org/dist/${NODE_VERSION}/node-${NODE_VERSION}-${{ matrix.node-dist }}.zip"
            powershell.exe -NoProfile -Command "Expand-Archive -Force node-pkg.zip ."
            cp "node-${NODE_VERSION}-${{ matrix.node-dist }}/node.exe" "apps/desktop/src-tauri/binaries/node-${{ matrix.node-triple }}.exe"
          else
            curl -fL -o node-pkg.tar.xz "https://nodejs.org/dist/${NODE_VERSION}/node-${NODE_VERSION}-${{ matrix.node-dist }}.tar.xz"
            tar -xJf node-pkg.tar.xz
            cp "node-${NODE_VERSION}-${{ matrix.node-dist }}/bin/node" "apps/desktop/src-tauri/binaries/node-${{ matrix.node-triple }}"
          fi
          ls -la apps/desktop/src-tauri/binaries/

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux deps (webkit2gtk + enigo xkbcommon)
        if: matrix.os-name == 'linux'
        run: |
          sudo apt-get update
          # cmake + g++: بناء openh264/audiopus_sys (libopus) المضمنين (FA-media §15)
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxkbcommon-dev cmake g++

      - name: Enable VBScript (WiX ICE validation needs it — GH runners ship without)
        if: matrix.os-name == 'windows'
        shell: powershell
        run: |
          $cap = Get-WindowsCapability -Online | Where-Object Name -like 'VBSCRIPT*'
          if ($cap -and $cap.State -ne 'Installed') { Add-WindowsCapability -Online -Name $cap.Name }
          (Get-WindowsCapability -Online | Where-Object Name -like 'VBSCRIPT*').State

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Detect updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "UPDATER_SIGN=true" >> "$GITHUB_ENV"
          else
            echo "UPDATER_SIGN=false" >> "$GITHUB_ENV"
            echo "⚠️ لا مفتاح توقيع updater — سيُبنى بلا updater artifacts"
          fi

      # §43 — النواة النائمة لـ X1 (Windows codesign): بلا أسرار = خطوة عبور
      # خالصة (السلوك التاريخي حرفيًا)؛ بالأسرار = استيراد PFX وبصمة تُغذي البناء
      - name: Import Windows codesign certificate (dormant — activates when WINDOWS_PFX_BASE64 secret exists)
        if: matrix.os-name == 'windows'
        # pwsh 7 حصرًا: powershell 5.1 يقرأ .ps1 بترميز ANSI فيفسد UTF-8 (درس جولة dispatch الحية)
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrEmpty($env:WINDOWS_PFX_BASE64)) {
            "WINDOWS_SIGNED=false" >> $env:GITHUB_ENV
            Write-Host "⚠️ بلا شهادة Windows (WINDOWS_PFX_BASE64) — يُبنى بلا توقيع Authenticode (السلوك التاريخي حرفيًا)"
            exit 0
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))
          $sec = ConvertTo-SecureString -String $env:WINDOWS_PFX_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $sec -Exportable
          Remove-Item $pfxPath -Force
          "WIN_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV
          "WINDOWS_SIGNED=true" >> $env:GITHUB_ENV
          Write-Host "✅ شهادة codesign مستوردة — البصمة $($cert.Thumbprint) (الموضوع: $($cert.Subject))"

      # §43 — النواة النائمة لـ X2 (macOS sign+notarize): المتغيرات تُكتب في
      # GITHUB_ENV حصرًا عند وجود الأسرار — غيابها = غياب المتغيرات = Tauri
      # يبني بلا توقيع تمامًا كما اليوم (لا تمرير قيم فارغة يوقّع الباندلر خطأً)
      - name: Detect Apple signing/notarization secrets (dormant — activates when Apple secrets exist)
        if: matrix.os-name == 'macos'
        shell: bash
        env:
          APPLE_CERTIFICATE_S: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD_S: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY_S: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID_S: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD_S: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID_S: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "${APPLE_CERTIFICATE_S:-}" ] && [ -n "${APPLE_SIGNING_IDENTITY_S:-}" ]; then
            echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE_S" >> "$GITHUB_ENV"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD_S" >> "$GITHUB_ENV"
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY_S" >> "$GITHUB_ENV"
            echo "MACOS_SIGN=true" >> "$GITHUB_ENV"
            echo "✅ شهادة Apple موجودة (P12 بbase64) — البناء موقّع بDeveloper ID"
          else
            echo "MACOS_SIGN=false" >> "$GITHUB_ENV"
            echo "⚠️ بلا شهادة Apple — يُبنى بلا توقيع/notarization (السلوك التاريخي حرفيًا)"
          fi
          if [ -n "${APPLE_ID_S:-}" ] && [ -n "${APPLE_PASSWORD_S:-}" ] && [ -n "${APPLE_TEAM_ID_S:-}" ]; then
            echo "APPLE_ID=$APPLE_ID_S" >> "$GITHUB_ENV"
            echo "APPLE_PASSWORD=$APPLE_PASSWORD_S" >> "$GITHUB_ENV"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID_S" >> "$GITHUB_ENV"
            echo "MACOS_NOTARIZE=true" >> "$GITHUB_ENV"
            echo "✅ بيانات notarization موجودة — سيُوقّع الباندلر ويُختَم (staple) آليًا"
          else
            echo "MACOS_NOTARIZE=false" >> "$GITHUB_ENV"
          fi

      - name: Build Tauri bundles (${{ matrix.bundles }})
        shell: bash
        working-directory: apps/desktop
        env:
          # linuxdeploy AppImage لا يعمل بلا FUSE على المُشغّل — استخراج ذاتي بدل التحميل
          APPIMAGE_EXTRACT_AND_RUN: "1"
          # linuxdeploy يفشل على strip لمكتبات .relr.dyn (جولات 24.04) — تعطيل strip
          NO_STRIP: "true"
          # CMake 4 الجديد أزال توافق <3.5 — libopus المضمن في audiopus_sys قديم
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # §43 — عقل الإعدادات في سكربت مُختبر (signing-config.sh): يُطابق
          # السلوك التاريخي حرفيًا بغياب التوقيع ويضيف كتلة windows عند البصمة
          CONFIG="$(bash signing-config.sh)"
          echo "CONFIG=$CONFIG"
          bunx @tauri-apps/cli@^2 build ${{ matrix.tauri-args }} \
            --bundles ${{ matrix.bundles }} \
            --config "$CONFIG"

      # §43 — إثبات حي داخل CI: المثبتات الموقعة تُتحقق Authenticode فورًا
      - name: Verify Authenticode signatures (signed builds only — §43)
        if: matrix.os-name == 'windows' && env.WINDOWS_SIGNED == 'true'
        shell: pwsh
        run: |
          $dir = "apps/desktop/src-tauri/target/release/bundle"
          $bins = @(Get-ChildItem $dir -Recurse -Include *.exe,*.msi | Where-Object { $_.FullName -match '\\(nsis|msi)\\' })
          if ($bins.Count -eq 0) { Write-Host "::error::لا مثبتات NSIS/MSI للتحقق"; exit 1 }
          $bad = 0
          foreach ($b in $bins) {
            $sig = Get-AuthenticodeSignature -FilePath $b.FullName
            Write-Host ("{0} → {1} [{2}]" -f $b.Name, $sig.Status, $sig.SignerCertificate.Subject)
            if ($sig.Status -ne 'Valid') { $bad++ }
          }
          if ($bad -gt 0) { exit 1 }
          Write-Host "✅ كل المثبتات موقعة Authenticode صالحة (SHA-256 مع طابع زمني)"

      # نسخة Portable لويندوز: نفس تخطيط NSIS تمامًا (exe + node.exe + resources/)
      # resolve_resources (procman.rs) يفحص هذا التخطيط أولًا — صفّر خطوات يدوية.
      - name: Assemble Windows portable ZIP
        if: matrix.os-name == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          OUT=apps/desktop/src-tauri/target/release
          STAGE="apps/desktop/src-tauri/target/portable/NexusLink-Portable-${VERSION}"
          mkdir -p "$STAGE/resources"
          # التنفيذي الرئيسي (cargo اسمه nexuslink-desktop، Tauri ينتج NexusLink)
          if [ -f "$OUT/NexusLink.exe" ]; then
            cp "$OUT/NexusLink.exe" "$STAGE/NexusLink.exe"
          elif [ -f "$OUT/nexuslink-desktop.exe" ]; then
            cp "$OUT/nexuslink-desktop.exe" "$STAGE/NexusLink.exe"
          else
            echo "الخطأ: التنفيذي الرئيسي غير موجود"; ls -la "$OUT"; exit 1
          fi
          # sidecar node → node.exe (resolve_node يبحث exe_dir/node.exe)
          # tauri CLI ينسخ sidecar إلى target/release معيدًا تسميته node.exe مسبقًا
          # (r8: النمط node-*.exe لم يعد موجودًا) — مع fallback للاسم الثلاثي
          NODE_BIN=""
          if [ -f "$OUT/node.exe" ]; then
            NODE_BIN="$OUT/node.exe"
          elif ls "$OUT"/node-*.exe >/dev/null 2>&1; then
            NODE_BIN=$(ls "$OUT"/node-*.exe | head -1)
          fi
          [ -n "$NODE_BIN" ] || { echo "الخطأ: sidecar node غير موجود"; ls -la "$OUT"; exit 1; }
          cp "$NODE_BIN" "$STAGE/node.exe"
          # الموارد بنفس تخطيط NSIS (بادئة resources/ محفوظة)
          for r in server comms gateway; do
            cp -r "apps/desktop/src-tauri/resources/$r" "$STAGE/resources/$r"
          done
          cp apps/desktop/PORTABLE-README.txt "$STAGE/README.txt"
          # bsdtar النظامي يدعم zip بالامتداد ويتعامل مع المسارات الطويلة أفضل من Compress-Archive
          /c/Windows/System32/tar.exe -a -cf \
            "apps/desktop/src-tauri/target/portable/NexusLink_${VERSION}_x64-portable.zip" \
            -C "$(dirname "$STAGE")" "$(basename "$STAGE")"
          ls -la apps/desktop/src-tauri/target/portable/

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os-name }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/**/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/**/*.deb
            # ‏.exe محصورة بمخرجات NSIS حصرًا — الموارد (مثبّت vcam داخل AppDir/nsis staging)
            # ‌ لا تُرفع أصلًا (كانت سبب سباق الإرفاق 404 بين الوظائف — v1.1.0-fix1)
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/**/*.msi
            apps/desktop/src-tauri/target/release/bundle/**/*.dmg
            apps/desktop/src-tauri/target/release/bundle/**/*.app.tar.gz
            apps/desktop/src-tauri/target/portable/*.zip
          if-no-files-found: error

      - name: Upload updater signatures
        if: env.UPDATER_SIGN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os-name }}-sigs
          path: apps/desktop/src-tauri/target/release/bundle/**/*.sig
          if-no-files-found: error

      # على وسوم v*: إرفاق تلقائي بالإصدار
      - name: Attach bundles to release (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          # G9: مسودة حصرًا — لا finalize/نشر من وظيفة منصة (يُعثر على مسودة prepare-release بالوسم)
          draft: true
          files: |
            apps/desktop/src-tauri/target/release/bundle/**/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/**/*.deb
            # ‏.exe محصورة بـ NSIS حصرًا — AppDir/nsis resources (vcam) كانت تصطدم
            # ‏بنفس اسم الأصل من وظيفة المنصة الأخرى → ‏404 أثناء التحديث المتزامن
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/**/*.msi
            apps/desktop/src-tauri/target/release/bundle/**/*.dmg
            apps/desktop/src-tauri/target/release/bundle/**/*.app.tar.gz
            apps/desktop/src-tauri/target/release/bundle/**/*.sig
            apps/desktop/src-tauri/target/portable/*.zip

      # على dispatch: إرفاق اختياري صريح (محمي افتراضيًا — لا يستبدل أصول موقعة)
      - name: Attach bundles to release (manual dispatch, opt-in)
        if: inputs.attach_to_release == true
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag }}
          # G9: إن غاب الإصدار يُنشأ مسودة؛ وإن وُجد تبقى حالته كما هي (لا نشر ضمني)
          draft: true
          files: |
            apps/desktop/src-tauri/target/release/bundle/**/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/**/*.deb
            apps/desktop/src-tauri/target/release/bundle/**/*.exe
            apps/desktop/src-tauri/target/release/bundle/**/*.msi
            apps/desktop/src-tauri/target/release/bundle/**/*.dmg
            apps/desktop/src-tauri/target/release/bundle/**/*.app.tar.gz
            apps/desktop/src-tauri/target/release/bundle/**/*.sig
            apps/desktop/src-tauri/target/portable/*.zip

  android:
    needs: [test, prepare-release]
    if: ${{ !cancelled() && needs.test.result == 'success' && (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexuslink_mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.5
          cache: true
      - name: Restore release signing key (secrets.ANDROID_KEYSTORE_BASE64)
        if: env.KEYSTORE_B64 != ''
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/app/nexuslink-release.jks
          cat > android/key.properties <<EOF
          storeFile=nexuslink-release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
      - run: flutter pub get
      - name: Patch flutter_webrtc for engine 3.24 (same patch verified locally)
        run: |
          PKG=$(ls -d "$HOME/.pub-cache/hosted/pub.dev/flutter_webrtc-"*)
          sed -i 's/compileSdkVersion 36/compileSdkVersion 34/' "$PKG/android/build.gradle"
          sed -i -e 's/public void onSurfaceAvailable()/public void onSurfaceCreated()/' -e 's/public void onSurfaceCleanup()/public void onSurfaceDestroyed()/' "$PKG/android/src/main/java/com/cloudwebrtc/webrtc/SurfaceTextureRenderer.java"
          echo "patched: $(grep -c 'compileSdkVersion 34' "$PKG/android/build.gradle") compileSdk, $(grep -c 'onSurfaceCreated' "$PKG/android/src/main/java/com/cloudwebrtc/webrtc/SurfaceTextureRenderer.java") callback"
      - name: Analyze (zero-issue gate)
        run: flutter analyze
      # G4: APK مقسّم لكل معمارية بدل APK شامل (~120MB) — arm64-v8a هو التنزيل الأساسي.
      # لا APK شامل: كل هاتف أندرويد 8+ حديث arm64؛ armeabi-v7a للأجهزة 32-بت القديمة؛
      # x86_64 للمحاكيات/Chromebook. الـAAB لمتجر Play (يوزّع المعمارية تلقائيًا).
      - name: Build signed split per-ABI APKs
        run: flutter build apk --release --split-per-abi
      - name: Build signed App Bundle
        run: flutter build appbundle --release
      # G3: حارس «صفر سحابة» — لا يُشحن إصدار يحوي ML Kit/Firebase/GMS
      - name: G3 zero-cloud guard (built APKs/AAB)
        run: |
          python3 ../scripts/android-zero-cloud-check.py \
            build/app/outputs/flutter-apk/app-*-release.apk \
            build/app/outputs/bundle/release/app-release.aab
      # أسماء الأصول (G4): NexusLink-<v>-<abi>-release.apk + NexusLink-<v>-release.aab
      # (اللاحقة release.apk محفوظة — scripts/updater-path-verify.mjs يجرد بها SHA256SUMS)
      - name: Rename artifacts with version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1)
          mkdir -p dist-android
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-${ABI}-release.apk" "dist-android/NexusLink-${VERSION}-${ABI}-release.apk"
          done
          cp build/app/outputs/bundle/release/app-release.aab "dist-android/NexusLink-${VERSION}-release.aab"
          ls -la dist-android/
          { echo "### Android release assets"; for f in dist-android/*; do echo "- $(basename "$f") — $(stat -c %s "$f") bytes"; done; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: nexuslink_mobile/dist-android/NexusLink-*-release.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: nexuslink_mobile/dist-android/NexusLink-*-release.aab
          if-no-files-found: error
      - name: Attach APKs + AAB to release (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          # G9: مسودة حصرًا — الرفع إلى مسودة prepare-release بالوسم
          draft: true
          files: |
            nexuslink_mobile/dist-android/NexusLink-*-release.apk
            nexuslink_mobile/dist-android/NexusLink-*-release.aab

  ios:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - name: Build IPA (unsigned — TestFlight needs Apple account)
        run: echo "flutter build ipa --release --no-codesign"
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: dist/**
          if-no-files-found: ignore

  # تجميع نهائي على الوسوم فقط: checksums + latest.json الموقّعة للمحدِّث
  release:
    needs: [desktop, android, ios]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { merge-multiple: true, path: dist }
      # الأصول تهبط متداخلة (bundle/<type>/…) لأن upload-artifact يخزّن نسبةً لجذر
      # البحث (LCA) — وv1.0.0 لم تمرّ بهذا المسار أبدًا (release job تُخطّى على dispatch
      # على main وتُجمع latest.json يدويًا). التسطيح شرط: picks وSHA256SUMS
      # (‎sha256sum *‎ على الجذر حصرًا) وsoftprops كلها تفترض ملفات بمستوى dist الجذر.
      - name: Flatten dist (artifacts carry bundle subpaths)
        run: |
          find dist -mindepth 2 -type f -exec mv -f {} dist/ \;
          find dist -mindepth 1 -type d -empty -delete
          ls -la dist/
      # ملاحظات الإصدار عربية/إنجليزية — ملف لكل وسم (docs/releases/<tag>.md)
      # حارس سريع: وسم بلا ملاحظات مزدوجة اللغة = فشل مبكر قبل أي رفع
      - name: Verify release notes exist (AR/EN)
        shell: bash
        run: |
          NOTES_FILE="docs/releases/${GITHUB_REF_NAME}.md"
          if [ ! -f "$NOTES_FILE" ]; then
            echo "ملاحظات الإصدار غائبة: $NOTES_FILE — أضفها قبل الوسم"; exit 1
          fi
          grep -q "## العربية" "$NOTES_FILE" && grep -q "## English" "$NOTES_FILE" || {
            echo "$NOTES_FILE يجب أن يحوي قسمي العربية وEnglish"; exit 1
          }
          echo "notes ok: $NOTES_FILE"
      - name: Generate latest.json (signed updater manifest)
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          python3 - <<'PY'
          import glob, json, os
          from datetime import datetime, timezone

          tag = os.environ["GITHUB_REF_NAME"]            # v1.0.0 | v1.1.0-fix1
          # الإصدار من البيئة الموحدة VERSION (تطابق الملفات الأربعة) — لاحقة الوسم
          # (fix1 مثلاً) اسم وسم بناء CI فقط بعد فشل جولة، ولا تدخل إصدار المحدّث أبدًا
          # (وإلا لتقرأ latest.json ‏1.1.0-fix1 وهو أقل من 1.1.0 في semver — كسر ترقية)
          version = os.environ.get("VERSION") or tag.lstrip("v")
          base = f"https://github.com/CTO-DRS/NexusLink/releases/download/{tag}"
          # أصول updater: توقيعات مولدة أثناء البناء (TAURI_SIGNING_PRIVATE_KEY)
          # ‏** تعبر المجلدات (recursive=True) — تحصين إضافي بعد تسطيح dist
          picks = {
              "windows-x86_64": "dist/**/NexusLink_*_x64-setup.exe.sig",
              "linux-x86_64": "dist/**/*.AppImage.sig",
              "darwin-aarch64": "dist/**/*.app.tar.gz.sig",
          }
          platforms = {}
          for plat, pattern in picks.items():
              files = sorted(glob.glob(pattern, recursive=True))
              if not files:
                  continue
              sig_path = files[0]
              asset = sig_path[: -len(".sig")]
              if not os.path.exists(asset):
                  continue
              with open(sig_path, encoding="utf-8") as f:
                  platforms[plat] = {
                      "signature": f.read().strip(),
                      "url": f"{base}/{os.path.basename(asset)}",
                  }
          latest = {
              "version": version,
              "pub_date": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "notes": f"NexusLink {version} — الإصدار الثابت لكل المنصات.",
              "platforms": platforms,
          }
          with open("dist/latest.json", "w", encoding="utf-8") as f:
              json.dump(latest, f, ensure_ascii=False, indent=2)
          print("latest.json:", list(platforms), "→", version)
          # المحدّث تعاقدي للمنصات الثلاث — بيان ناقص يُسقط تحديثات منصة كاملة بصمت
          missing = sorted(set(picks) - set(platforms))
          if missing:
              raise SystemExit(f"منصات updater ناقصة: {missing} — فشل")
          PY
      - name: Generate SHA256 checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - name: Attach static release page
        run: cp public/NexusLink-Release-Page.html dist/
      # G9 — الإصدار مسودة: /releases/tags/<tag> لا يُعيدها ⇒ البحث في القائمة الكاملة.
      # يتأكد أن الإصدار ما زال مسودة قبل رفع latest.json/SHA256SUMS (النشر يدوي للمالك).
      - name: Locate draft release by tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          FOUND=$(gh api "repos/$REPO/releases?per_page=100" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\") | \"\(.id) \(.draft)\"")
          FOUND="${FOUND%%$'\n'*}"   # الأول فقط (بلا head — SIGPIPE مع pipefail)
          [ -n "$FOUND" ] || { echo "::error::لا مسودة إصدار للوسم $TAG (prepare-release؟)"; exit 1; }
          read -r RID RDRAFT <<< "$FOUND"
          [ "$RDRAFT" = "true" ] || { echo "::error::الإصدار $TAG لم يعد مسودة (id=$RID) — نُشر قبل اكتمال الأصول؟"; exit 1; }
          echo "draft release id=$RID → سيُستكمل بـ latest.json + SHA256SUMS (يبقى مسودة)"
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          # ملاحظاتنا (عربي/إنجليزي) تُسبق ملاحظات الوسوم المولّدة تلقائيًا
          body_path: docs/releases/${{ github.ref_name }}.md
          files: dist/**
