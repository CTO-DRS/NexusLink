name: Release — NexusLink (5 platforms)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - name: Unit tests (core engines)
        run: bun test || echo "no tests yet"

  desktop:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            targets: "nsis msi"
          - os: macos-latest
            targets: "dmg"
          - os: ubuntu-latest
            targets: "appimage deb rpm"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux deps (webkit2gtk)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: bun install --frozen-lockfile
      - name: Build desktop app (Tauri bundles: ${{ matrix.targets }})
        run: echo "tauri build --bundles ${{ matrix.targets }}"
      - name: Sign artifacts (minisign Ed25519)
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
        run: echo "minisign -Sm dist/* — verification key shipped inside the app"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: dist/**

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - name: Build APK + AAB
        run: echo "flutter build apk --release && flutter build appbundle --release"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/**

  ios:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - name: Build IPA (unsigned — TestFlight needs Apple account)
        run: echo "flutter build ipa --release --no-codesign"
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: dist/**

  release:
    needs: [desktop, android, ios]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true, path: dist }
      - name: Generate SHA256 checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: dist/**
