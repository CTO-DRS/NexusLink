# بوابة الجودة — lint + فحص الأنواع + بناء إنتاجي على كل دفعة وطلب دمج
#
# العقيدة: ما يُقاس يُصان — أساس tsc صفر (تكليف 29) وأساس lint نظيف يُحرسان آليًا
# فلا يعود خطأ نوع أو كسر بناء يمر صامتًا في أي دفعة مستقبلية.
#
# التصميم:
#  · bun فقط (المستودع bun.lock) — بلا package-lock ولا yarn.
#  · bun install --frozen-lockfile ثم prisma generate ثم الحاجز الثلاثي:
#    eslint . · tsc --noEmit · next build (بناء إنتاجي كامل بstandalone).
#  · بلا أسرار وبلا صلاحيات كتابة — قراءة حصرًا.

name: Quality — Lint + Types + Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      # الخدمات المصغّرة حزم مستقلة بعتمادياتها (tsconfig الجذري يشملها بـ**/*.ts)
      - name: Install mini-services dependencies
        run: cd mini-services/comms-service && bun install

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Lint (eslint)
        run: bun run lint

      # G8 — عدد فحوص E2E المعلن واحد في README وصفحة الإصدار (المصدر: سجل الأساس في worklog.md)
      - name: E2E count consistency (README + release page)
        run: node scripts/e2e-count.mjs --check

      # G1 — البوابة آمنة افتراضيًا: من عنوان LAN حقيقي للمشغّل، بلا رمز → 401 وبالرمز → 200
      # (صفر تبعيات — البوابة الحقيقية أمام upstream وهمي، لا يحتاج بناءً)
      - name: G1 gateway pair-token E2E (LAN 401 / token 200)
        run: node scripts/g1-gateway-e2e.mjs

      - name: Bridges bind loopback only (P0)
        run: node scripts/bridge-bind-check.mjs

      - name: P1 discovery beacon E2E (pcId + whitelisted UDP beacon)
        run: node scripts/discovery-beacon-e2e.mjs

      - name: Types (tsc — الأساس صفر منذ تكليف 29)
        run: bunx tsc --noEmit

      - name: Production build (next build)
        run: bun run build

      # G7 — ترويسات الأمان على كل المسارات (HTML · API · 404 · أصول ساكنة) وصفحات خطأ
      # عامة بلا مسارات داخلية: يشغّل الخادم المبني (standalone) ويفحص عينة مسارات
      - name: Security headers check (G7)
        run: node scripts/check-security-headers.mjs
