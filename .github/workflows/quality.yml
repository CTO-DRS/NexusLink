# بوابة الجودة — lint + فحص الأنواع + بناء إنتاجي على كل دفعة وطلب دمج
#
# العقيدة: ما يُقاس يُصان — أساس tsc صفر (تكليف 29) وأساس lint نظيف يُحرسان آليًا
# فلا يعود خطأ نوع أو كسر بناء يمر صامتًا في أي دفعة مستقبلية.
#
# التصميم:
#  · bun فقط (المستودع bun.lock) — بلا package-lock ولا yarn.
#  · bun install --frozen-lockfile ثم prisma generate ثم الحاجز الثلاثي:
#    eslint . · tsc --noEmit · next build (بناء إنتاجي كامل بstandalone).
#  · بلا أسرار وبلا صلاحيات كتابة — قراءة حصرًا.

name: Quality — Lint + Types + Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      # الخدمات المصغّرة حزم مستقلة بعتمادياتها (tsconfig الجذري يشملها بـ**/*.ts)
      - name: Install mini-services dependencies
        run: cd mini-services/comms-service && bun install

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Lint (eslint)
        run: bun run lint

      - name: Types (tsc — الأساس صفر منذ تكليف 29)
        run: bunx tsc --noEmit

      - name: Production build (next build)
        run: bun run build
